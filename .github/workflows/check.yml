# The gate on every push to main and every pull request: `make check` (formatting, the program
# built into one file, the Lua tests of the page against the kit, the built program played in a
# pane by pencere's stand-in terminal with a stand-in docker, and the installer's tests), on Linux
# and macOS.
#
# The program is built by the released `pencere` command of tools/pencere-version, as a release
# is. The stand-in terminal has no release, and the page's tests run against the kit's prelude, so
# both come from a checkout of pencere at PENCERE_REF: moving that commit is a change of this file,
# and of dockerpen's page when the kit moved.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The commit of pencere the stand-in terminal and the kit's page API are taken from.
  PENCERE_REF: 81ec1b01602ecda9ff95410b2bce39f0e4447e2e

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bateri/pencere
          ref: ${{ env.PENCERE_REF }}
          path: pencere
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install the pencere command
        run: |
          PENCERE_VERSION="$(cat tools/pencere-version)" PENCERE_INSTALL="$RUNNER_TEMP/pencere" \
            sh -c "$(curl --proto '=https' --tlsv1.2 -fsSL https://raw.githubusercontent.com/bateri/pencere/main/cli/install.sh)"
      - name: Build the stand-in terminal from pencere
        working-directory: pencere
        run: cargo build -p pencere-fake-host
      - name: Install StyLua
        run: cargo install stylua --locked --features luau --version 2.6.0 --root "$RUNNER_TEMP/stylua"
      - name: make check
        run: |
          export PATH="$RUNNER_TEMP/stylua/bin:$PATH"
          make check \
            PENCERE="$RUNNER_TEMP/pencere/pencere" \
            FAKE_HOST=pencere/target/debug/pencere-fake-host \
            PRELUDE=pencere/kit/luau/prelude
      - name: Say what the runner was built from
        run: |
          {
            echo "### What this run was held to"
            echo
            echo "The \`pencere\` command $(cat tools/pencere-version), as released; pencere at \`$PENCERE_REF\`: its \`pencere-fake-host\` and the prelude of its kit (\`kit/luau/prelude\`) that the page's tests run the page against."
          } >> "$GITHUB_STEP_SUMMARY"
