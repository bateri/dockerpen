# The gate on every push to main and every pull request: `make check` (formatting, the program
# built into one file, the Lua tests of the page against the kit, the built program played in a
# pane by pencere's stand-in terminal with a stand-in docker, and the installer's tests), on Linux
# and macOS.
#
# The `pencere` command, the stand-in terminal and the kit's prelude the page's tests run against
# all come from a checkout of pencere at PENCERE_REF, so the gate holds dockerpen to the kit it is
# written for (2.0), which no release of the command offers yet: moving that commit is a change of
# this file, and of dockerpen's page when the kit moved. A release is still built by the released
# command of tools/pencere-version (release.yml), which fetches the runner of each target.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The commit of pencere the command, the stand-in terminal and the kit's page API are taken from.
  PENCERE_REF: b5342c053d5c23080274cc3fa515e2df818d8969

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: bateri/pencere
          ref: ${{ env.PENCERE_REF }}
          path: pencere
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build the pencere command and the stand-in terminal from pencere
        working-directory: pencere
        run: cargo build -p pencere-cli -p pencere-fake-host
      - name: Install StyLua
        run: cargo install stylua --locked --features luau --version 2.6.0 --root "$RUNNER_TEMP/stylua"
      - name: make check
        run: |
          export PATH="$RUNNER_TEMP/stylua/bin:$PATH"
          make check \
            PENCERE=pencere/target/debug/pencere \
            FAKE_HOST=pencere/target/debug/pencere-fake-host \
            PRELUDE=pencere/kit/luau/prelude
      - name: Say what the runner was built from
        run: |
          {
            echo "### What this run was held to"
            echo
            echo "pencere at \`$PENCERE_REF\`: its \`pencere\` command, its \`pencere-fake-host\` and the prelude of its kit (\`kit/luau/prelude\`) that the page's tests run the page against."
          } >> "$GITHUB_STEP_SUMMARY"
