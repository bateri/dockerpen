# The gate on every push to main and every pull request: `make check` (formatting, the program
# built into one file, the Lua tests of the page against the kit, the built program played in a
# pane by pencere's stand-in terminal with a stand-in docker, and the installer's tests), on Linux
# and macOS.
#
# pencere, which dockerpen is built and tested with, is the one in tools/pencere-ref: `make check`
# fetches it at that commit or release tag and builds its command and its stand-in terminal there
# (`make pencere`), as it does on a maintainer's machine, so the gate holds dockerpen to the kit it
# is written for and to nothing else. Moving it is a change of that file, and of dockerpen's page
# when the kit moved.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The Rust pencere is built with (its rust-version), as a release builds it.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.88.0
      - name: Install StyLua
        run: cargo install stylua --locked --features luau --version 2.6.0 --root "$RUNNER_TEMP/stylua"
      - name: make check
        run: |
          export PATH="$RUNNER_TEMP/stylua/bin:$PATH"
          make check
      - name: Say what the gate was held to
        run: |
          {
            echo "### What this run was held to"
            echo
            echo "pencere at \`$(cat tools/pencere-ref)\` (\`tools/pencere-ref\`): its \`pencere\` command, its \`pencere-fake-host\` and the prelude of its kit (\`kit/luau/prelude\`) that the page's tests run the page against."
          } >> "$GITHUB_STEP_SUMMARY"
