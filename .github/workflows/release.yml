# Releases what a commit on main has prepared (RELEASING.md). It runs when the gate (check.yml) has
# finished green on a push to main, and when it is started by hand:
#
# - plan: whether the version in src/program/version.lua has no tag yet (`make release-prepare`,
#   committed and pushed). A commit that moved no version ends here.
# - target: each target on a machine of its own: its runner built from the pencere of
#   tools/pencere-ref (`make runner`, pencere's own recipe), dockerpen packed into it by the command
#   of that pencere (`make pack`), and the file played under the stand-in terminal there (`make
#   test-binary`).
# - files: the three files summed, checked (`make sums`) and attested (provenance).
# - draft: the tag `v<version>` and the GitHub release as a draft, with the changelog section as its
#   notes and the files.
# - publish: waits in the `release` environment for a maintainer to approve it, refuses an
#   environment with no required reviewers, checks the draft's files against their sums and
#   attestations, and makes it public as the Latest.
#
# Started by hand on main, it finishes a release that stopped half way (tagged on this commit, not
# yet public), if the gate is green on it. With `rehearse` it only builds, on any branch, and keeps
# the files as a workflow artifact: no tag, no release, no attestation.
name: release

on:
  workflow_run:
    workflows: [check]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      rehearse:
        description: Only build and check; tag and publish nothing
        type: boolean
        default: false

# What is released: the files are $NAME-<version>-<target>.
env:
  NAME: dockerpen

# One release at a time, and none is cut short by the next.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  # A run of the gate on a pull request, or on a branch of a fork named main, is never a release.
  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
      rehearse: ${{ steps.sha.outputs.rehearse }}
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - id: sha
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          REHEARSE: ${{ inputs.rehearse == true }}
        run: |
          if [ "$EVENT" = workflow_run ]; then
            echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"
            echo "rehearse=false" >> "$GITHUB_OUTPUT"
          else
            if [ "$REHEARSE" != true ] && [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::a release is made from main; start it on main, or rehearse"
              exit 1
            fi
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            echo "rehearse=$REHEARSE" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # After the gate's run, this commit is green; started by hand, plan asks GitHub whether it is.
      - id: plan
        if: steps.sha.outputs.rehearse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RESUME: ${{ github.event_name == 'workflow_dispatch' }}
          RELEASE_REQUIRE_CHECK: ${{ github.event_name == 'workflow_dispatch' }}
        run: node tools/release.mjs plan >> "$GITHUB_OUTPUT"

  # Each target on a machine of its own system and architecture, from nothing (no cache, no
  # emulation: DIST_NATIVE): its runner built from the pencere of tools/pencere-ref, dockerpen packed
  # into it by the command of that pencere, and the file played in a pane of the stand-in terminal
  # as the gate plays dist/dockerpen, on the machine it is for.
  target:
    needs: plan
    if: needs.plan.outputs.release == 'true' || needs.plan.outputs.rehearse == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The Mac runner is built by this toolchain for its target; a Linux one is built in Docker.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && matrix.target || '' }}
      - env:
          DIST_NATIVE: "1"
        run: make runner TARGET=${{ matrix.target }}
      - run: make pack TARGET=${{ matrix.target }}
      - run: make test-binary DOCKERPEN_BIN="dist/release/$NAME-$(node tools/release.mjs version)-${{ matrix.target }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: file-${{ matrix.target }}
          path: dist/release/${{ env.NAME }}-*
          if-no-files-found: error

  # The three files together: their sums, the check of them (the files of this version, each the one
  # the sums list, and the one this machine runs saying its version), and for a release the
  # attestation of what was built here.
  files:
    needs: [plan, target]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: file-*
          path: dist/release
          merge-multiple: true
      # An artifact keeps no file modes.
      - run: chmod +x dist/release/$NAME-*
      - run: make sums
      - if: needs.plan.outputs.rehearse != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/${{ env.NAME }}-*
            dist/release/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/release/
          if-no-files-found: error

  # The tag, and the GitHub release as a draft. A job that is run again leaves a tag that is on
  # this commit and makes the draft again; a release that is public is not touched.
  draft:
    needs: [plan, files]
    if: needs.files.result == 'success' && needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist/release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node tools/release.mjs tag
          node tools/release.mjs draft dist/release

  # Waits for a maintainer's approval in the `release` environment (Settings, Environments: its
  # required reviewers); nothing is public before it.
  publish:
    needs: [plan, draft]
    if: needs.draft.result == 'success'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ENVIRONMENT: release
        run: node tools/release.mjs publish
