<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dockerpen harness</title>
    <style>
      :root {
        color-scheme: dark;
        font:
          12px ui-monospace,
          Menlo,
          monospace;
      }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        grid-template-rows: auto 1fr;
        background: #2b2d31;
        color: #ccc;
      }
      header {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 6px 10px;
        background: #1e1f22;
        border-bottom: 1px solid #111;
      }
      header label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      select,
      button {
        font: inherit;
        background: #313338;
        color: #ddd;
        border: 1px solid #444;
        border-radius: 4px;
        padding: 2px 6px;
      }
      #stage {
        display: grid;
        place-items: center;
        overflow: auto;
        padding: 16px;
      }
      #pane {
        display: flex;
        flex-direction: column;
        border-radius: 10px;
        overflow: hidden;
        box-shadow:
          0 20px 60px rgba(0, 0, 0, 0.5),
          0 0 0 1px rgba(255, 255, 255, 0.06);
      }
      /* bateri's strip over a program's view: its icon and name, the view's title, the way out. */
      #strip {
        height: 32px;
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 10px;
        font-size: 12px;
        background: #111;
        color: #888;
      }
      #strip-icon {
        width: 16px;
        height: 16px;
      }
      #strip-icon:not([src]) {
        display: none;
      }
      #strip-program {
        font-weight: 600;
      }
      #strip-title {
        margin-left: 8px;
        opacity: 0.8;
      }
      #strip-quit {
        margin-left: auto;
        padding: 2px 8px;
        border-radius: 5px;
        box-shadow: inset 0 0 0 1px currentColor;
        opacity: 0.7;
      }
      iframe {
        border: 0;
        display: block;
      }
      body.bare {
        grid-template-rows: 1fr;
      }
      body.bare header {
        display: none;
      }
      body.bare #stage {
        padding: 0;
        overflow: hidden;
      }
      body.bare #pane {
        border-radius: 0;
        box-shadow: none;
      }
      #log {
        color: #888;
        flex: 1;
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }
    </style>
  </head>
  <body>
    <header>
      <b>dockerpen harness</b>
      <label
        >theme
        <select id="theme"></select
      ></label>
      <label
        >pane
        <select id="size"></select
      ></label>
      <button id="reload" type="button">restart view</button>
      <span id="log"></span>
    </header>
    <div id="stage">
      <div id="pane">
        <div id="strip">
          <img id="strip-icon" alt="" /><span id="strip-program">dockerpen</span
          ><span id="strip-title"></span><span id="strip-quit">Quit ⌃C</span>
        </div>
        <iframe id="view" title="view"></iframe>
      </div>
    </div>
    <script type="module" src="./host.ts"></script>
  </body>
</html>
